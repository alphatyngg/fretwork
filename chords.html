    <head>
        <meta charset="UTF-8"/>

        <title>Chords - Fretwork</title>

        <link rel="preconnect" href="https://fonts.googleapis.com"/>
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
        <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>

    </head>

    <body>
        <div class="page">
            <header class="badge">
                <div>
                    <h1><a href="index.html" class="brand">Fretwork</a></h1>
                    <div class="tagline"><strong>Chord Library</strong> &middot; Shapes &middot; Voicings &middot; Fingerings</div>
                </div>
                <nav class="site-nav">
                    <a href="index.html">Fretboard</a>
                    <a href="circle-of-fifths.html">Circle of Fifths</a>

                </nav>
            </header>

            <section class="panel">
                <h2>Chord Library</h2>

                <div class="field">
                    <label>Root note</label>
                    <div class="root-picker" id="chordRootPicker" role="group" aria-label="Chord root">
                        <button class="chip" aria-pressed="true">C</button>
                        <button class="chip" aria-pressed="false">C#</button>
                        <button class="chip" aria-pressed="false">D</button>
                        <button class="chip" aria-pressed="false">D#</button>
                        <button class="chip" aria-pressed="false">E</button>
                        <button class="chip" aria-pressed="false">F</button>
                        <button class="chip" aria-pressed="false">F#</button>
                        <button class="chip" aria-pressed="false">G</button>
                        <button class="chip" aria-pressed="false">G#</button>
                        <button class="chip" aria-pressed="false">A</button>
                        <button class="chip" aria-pressed="false">A#</button>
                        <button class="chip" aria-pressed="false">B</button>
                    </div>
                </div>
                
                <div id="chordGrid"></div>
            </section>

            <footer class="site-footer">
                <p class="footer-note">Runs entirely in your browser - no audio is recorded or sent anywhere.</p>
